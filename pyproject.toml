[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "web-testing-assistant"
version = "1.1.5"
description = "Desktop app where Claude Code runs web-app tests and the user reviews them"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "SQLAlchemy>=2.0",
    "openpyxl>=3.1,<3.2",  # pinned: wta.export.xlsx.PngImage overrides Image._data
    "python-docx>=1.1",
    "jsonschema>=4.23,<5",  # Test Case Designer: validates model responses (schema (a), draft 2020-12)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wta = ["assets/*.svg", "assets/*.png", "assets/*.ico", "assets/icons/*", "designer/prompts/*/*"]
