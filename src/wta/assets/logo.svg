<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Web Testing Assistant logo: a bug on a brick-red tile, with a check badge. Original artwork. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B23A2A"/>
      <stop offset="1" stop-color="#8A2518"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
  <!-- legs -->
  <g stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M86 112 L58 96"/>
    <path d="M82 142 L50 142"/>
    <path d="M86 172 L58 190"/>
    <path d="M170 112 L198 96"/>
    <path d="M174 142 L206 142"/>
    <path d="M170 172 L198 190"/>
    <!-- antennae -->
    <path d="M114 72 Q104 50 88 44"/>
    <path d="M142 72 Q152 50 168 44"/>
  </g>
  <!-- head -->
  <ellipse cx="128" cy="84" rx="26" ry="20" fill="#FFFFFF"/>
  <!-- body -->
  <ellipse cx="128" cy="146" rx="46" ry="58" fill="#FFFFFF"/>
  <!-- wing split line -->
  <path d="M128 98 L128 202" stroke="#8A2518" stroke-width="7" stroke-linecap="round"/>
  <!-- check badge -->
  <circle cx="190" cy="194" r="40" fill="#FFFFFF"/>
  <circle cx="190" cy="194" r="32" fill="#2E8B57"/>
  <path d="M174 195 L186 207 L207 183" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
